server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: backend-template
  threads:
    virtual:
      enabled: true # Habilita Project Loom / Virtual Threads de Java 21

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
